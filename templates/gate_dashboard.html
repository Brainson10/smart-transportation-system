<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gate Dashboard</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-slate-100">

<!-- ================= TOP NAVBAR ================= -->
<header class="bg-gradient-to-r from-slate-900 to-slate-800 text-white px-10 py-5 shadow">
    <div class="flex items-center justify-between">

        <!-- LEFT: TITLE -->
        <div>
            <h1 class="text-xl font-semibold">Gate Dashboard</h1>
            <p class="text-sm text-slate-300">
                Real-time Vehicle Entry Monitoring
            </p>
        </div>

        <!-- RIGHT: HOME BUTTON -->
        <a
            href="/"
            class="px-5 py-2 rounded-lg border border-slate-500
                   text-sm font-semibold text-white
                   hover:bg-slate-700 transition"
        >
             Home
        </a>

    </div>
</header>

<!-- ================= MAIN CONTENT ================= -->
<main class="flex-1 px-10 py-8">
    <div class="grid grid-cols-12 gap-8">

        <!-- ================= LIVE CAMERA CARD ================= -->
        <div class="col-span-8 bg-white rounded-xl shadow p-6">
            <h2 class="text-sm font-semibold text-slate-700 mb-3">
                Live Camera – {{ gate | capitalize }} Gate
            </h2>

            <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden">
                <img
                    src="{{ url_for('video_feed', gate=gate) }}"
                    alt="Live Camera"
                    class="w-full h-full object-cover"
                >
            </div>

            <p class="mt-3 text-sm text-green-600 font-medium flex items-center gap-2">
                <span class="w-2 h-2 bg-green-600 rounded-full"></span>
                Live · Automatic Detection Enabled
            </p>
        </div>

        <!-- ================= ANPR RESULT CARD ================= -->
        <div class="col-span-4 bg-white rounded-xl shadow p-6">
            <h2 class="text-sm font-semibold text-slate-700 mb-6">
                ANPR Result
            </h2>

            <div class="space-y-5 text-sm">

                <div>
                    <p class="text-slate-500 mb-1">Vehicle Number</p>
                    <p id="vehicle" class="font-semibold text-slate-800">—</p>
                </div>

                <div>
                    <p class="text-slate-500 mb-1">OCR Confidence</p>
                    <p id="confidence" class="font-semibold text-slate-800">—</p>
                </div>

                <div>
                    <p class="text-slate-500 mb-1">Decision</p>
                    <p id="decision" class="font-semibold text-slate-600">
                        Waiting…
                    </p>
                </div>

                <div>
                    <p class="text-slate-500 mb-1">Reason</p>
                    <p id="reason" class="font-semibold text-slate-800">—</p>
                </div>

            </div>
        </div>

    </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-slate-200 text-center text-xs text-slate-600 py-3">
    © 2026 Smart Transportation System | Academic Demo
</footer>

<!-- ================= LIVE UPDATE SCRIPT ================= -->
<script>
setInterval(() => {
    fetch("/gate/latest_result")
        .then(res => res.json())
        .then(d => {
            if (!d) return;

            const vehicleEl = document.getElementById("vehicle");
            const confidenceEl = document.getElementById("confidence");
            const decisionEl = document.getElementById("decision");
            const reasonEl = document.getElementById("reason");

            if (d.decision === "WAITING") {
                vehicleEl.innerText = "—";
                confidenceEl.innerText = "—";
                decisionEl.innerText = "Waiting…";
                decisionEl.className = "font-semibold text-slate-600";
                reasonEl.innerText = d.reason || "No vehicle detected";
                return;
            }

            vehicleEl.innerText = d.vehicle_number || "—";
            confidenceEl.innerText = d.confidence + "%";
            decisionEl.innerText = d.decision;
            reasonEl.innerText = d.reason;

            if (d.decision.includes("ALLOW")) {
                decisionEl.className = "font-semibold text-green-600";
            } else if (d.decision.includes("DENY")) {
                decisionEl.className = "font-semibold text-red-600";
            } else if (d.decision.includes("MANUAL")) {
                decisionEl.className = "font-semibold text-yellow-600";
            } else {
                decisionEl.className = "font-semibold text-slate-600";
            }
        });
}, 2000);
</script>

</body>
</html>
