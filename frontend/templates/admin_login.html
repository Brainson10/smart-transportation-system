<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-100">

  <div class="bg-white p-8 rounded-xl shadow-lg w-[380px]">
    <h2 class="text-2xl font-semibold text-center mb-1">
      Admin Login
    </h2>
    <p class="text-center text-sm text-slate-500 mb-6">
      Smart Transportation System
    </p>

    {% if error %}
      <div class="bg-red-100 text-red-600 p-2 rounded text-sm mb-4">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      <div class="mb-4">
        <label class="text-sm font-medium">Username</label>
        <input type="text" name="username" required
               class="w-full mt-1 px-3 py-2 border rounded-lg">
      </div>

      <div class="mb-6">
        <label class="text-sm font-medium">Password</label>
        <input type="password" name="password" required
               class="w-full mt-1 px-3 py-2 border rounded-lg">
      </div>

      <button
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">
        Login
      </button>
    </form>
  </div>

</body>
</html>
