<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin account · Smart Transportation</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><div class="auth-page"><main class="card auth-card"><a class="brand" href="{{ url_for('admin_dashboard') }}"><span class="brand-mark">ST</span><span><span class="brand-name">Smart Transport</span><br><span class="brand-sub">Administration</span></span></a><h1>Change password</h1><p>Signed in as {{ username }}</p>
{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" minlength="{{ min_length|default(8) }}" autocomplete="new-password" required><small>At least {{ min_length|default(8) }} characters.</small></label><label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" required></label><div class="row"><button class="btn btn-primary" type="submit">Update password</button><a class="btn" href="{{ url_for('admin_dashboard') }}">Cancel</a></div></form></main></div></body></html>
