<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Prohibited Time</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-slate-100">

<!-- ================= HEADER ================= -->
<header class="bg-gradient-to-r from-slate-900 to-slate-800 text-white px-10 py-6">
    <h1 class="text-2xl font-semibold">Set Prohibited Time</h1>
    <p class="text-sm text-slate-300">
        Configure restricted entry time for road segment
    </p>

    <a href="{{ url_for('manage_roads') }}"
       class="inline-block mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
        ← Back to AI Roads
    </a>
</header>

<!-- ================= MAIN ================= -->
<main class="flex-1 flex items-center justify-center px-6 py-12">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">

        <h2 class="text-xl font-semibold text-slate-800 mb-1">
            {{ road[0] }}
        </h2>
        <p class="text-sm text-slate-500 mb-6">
            Prohibited Time Settings
        </p>

        <form method="POST" class="space-y-5">

            <!-- Start Time -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Prohibited Start Time
                </label>
                <input type="time"
                       name="prohibited_start"
                       value="{{ road[1] }}"
                       class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- End Time -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Prohibited End Time
                </label>
                <input type="time"
                       name="prohibited_end"
                       value="{{ road[2] }}"
                       class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Buttons -->
            <div class="flex items-center justify-between pt-4">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium">
                    Save Prohibited Time
                </button>

                <a href="{{ url_for('manage_roads') }}"
                   class="text-blue-600 hover:underline text-sm">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="text-center text-sm text-slate-500 py-4">
    © 2026 Smart Transportation System | Academic Demo
</footer>

</body>
</html>
