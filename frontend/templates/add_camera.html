<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Camera</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='add_camera.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
</head>
<body>

<div class="page-container">

  <header class="hero-header">
    <h1>Add New Camera</h1>
    <p>Smart Transportation System – AI Safety Intelligence</p>
    <a href="{{ url_for('camera_management.manage_cameras') }}">← Back to Cameras</a>
  </header>

  <main class="content">
    <div class="form-card">
      <h2>Add Camera</h2>
      <p class="subtitle">Register a new surveillance camera</p>

      {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="name">Camera Name</label>
          <input type="text" id="name" name="name" placeholder="Camera Name"
                 value="{{ form.get('name', '') }}" maxlength="80" required>
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="Location"
                 value="{{ form.get('location', '') }}" maxlength="80" required>
        </div>

        <div class="form-group">
          <label for="zone">Zone <span class="muted">(optional)</span></label>
          <input type="text" id="zone" name="zone" placeholder="e.g. Main Gate Road"
                 value="{{ form.get('zone', '') }}" maxlength="80">
        </div>

        <div class="form-group">
          <label for="coverage">Coverage <span class="muted">(optional)</span></label>
          <input type="text" id="coverage" name="coverage" placeholder="e.g. Entry lane"
                 value="{{ form.get('coverage', '') }}" maxlength="120">
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="ONLINE" {{ 'selected' if form.get('status', 'ONLINE') == 'ONLINE' }}>ONLINE</option>
            <option value="OFFLINE" {{ 'selected' if form.get('status') == 'OFFLINE' }}>OFFLINE</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit">Add Camera</button>
          <a href="{{ url_for('camera_management.manage_cameras') }}" class="btn-cancel">Cancel</a>
        </div>

      </form>
    </div>
  </main>

  <footer class="footer">
    © 2026 Smart Transportation System | Academic Demo
  </footer>

</div>

</body>
</html>
